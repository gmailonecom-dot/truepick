<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist — TruePick</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="tp-header"></div>
<div id="tp-drawer"></div>

<main>
  <div class="page-h">
    <div class="crumb"><a href="index.html">Home</a> / Wishlist</div>
    <h1>Your wishlist</h1>
    <p>Products you show interest in are saved here — on this device.</p>
  </div>
  <section class="section">
    <div class="grid" id="grid"></div>
  </section>
</main>

<div id="tp-footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/layout.js"></script>
<script>
TP.mountLayout('wishlist');
(async () => {
  const products = await TP.api('products');
  const ids = TP.wishlist.all();
  const list = (products || []).filter(p => ids.includes(p.id));
  const el = document.getElementById('grid');
  if (!list.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      <p>Nothing saved yet.</p>
      <p style="margin-top:12px"><a class="btn btn-primary" href="catalogue.html">Browse the catalogue</a></p></div>`;
    return;
  }
  TP.renderGrid(el, list);
})();
</script>
</body>
</html>
