<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading — TruePick</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="tp-header"></div>
<div id="tp-drawer"></div>

<main>
  <div class="page-h" style="padding-bottom:0"><div class="crumb"><a href="blog.html">Blog</a></div></div>
  <section class="section"><article class="reader" id="reader"></article></section>
</main>

<div id="tp-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/layout.js"></script>
<script>
TP.mountLayout('blog');
(async () => {
  const posts = await TP.api('blogs');
  const id = new URLSearchParams(location.search).get('id');
  const p = (posts || []).find(x => x.id === id) || (posts || [])[0];
  const el = document.getElementById('reader');
  if (!p) { el.innerHTML = '<p>Post not found. <a href="blog.html">Back to blog</a></p>'; return; }
  document.title = p.title + ' — TruePick';
  const plain = (p.body || []).join(' ');
  el.innerHTML = `
    <div class="cover" style="border-radius:18px;overflow:hidden;margin-bottom:16px"><img src="${TP.esc(p.cover)}" alt=""></div>
    <button class="listen" id="listen"><span class="dot"></span><span>Listen to this article</span></button>
    <h1>${TP.esc(p.title)}</h1>
    <div class="meta">${TP.esc(p.date)} · ${TP.esc(p.author)} · ${Math.max(1, Math.round(plain.split(/\s+/).length / 200))} min read</div>
    <div class="prose">${(p.body || []).map(par => `<p>${TP.esc(par)}</p>`).join('')}</div>`;
  document.getElementById('listen').addEventListener('click', e => TP.speak(e.currentTarget, p.title + '. ' + plain));
  window.addEventListener('beforeunload', () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); });
})();
</script>
</body>
</html>
